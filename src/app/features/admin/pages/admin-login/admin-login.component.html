<div class="hs-login-wrapper">
  <div class="hs-login-card">
    <div class="hs-login-header">
      <a routerLink="/" class="hs-login-brand" aria-label="Volver al inicio">
        <span class="hs-brand-text">Hilly<span>Store</span></span>
      </a>
      <span class="hs-login-badge">Acceso Administrativo</span>
      <p class="hs-login-hint">Ingresa tus credenciales para gestionar el catálogo y ajustes de la tienda en Baní.</p>
    </div>

    @if (errorMessage()) {
      <div class="hs-login-error" role="alert">
        <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form class="hs-login-form" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="hs-field">
        <label for="adminEmail" class="hs-label">Correo electrónico</label>
        <div class="hs-input-wrap">
          <i class="pi pi-envelope" aria-hidden="true"></i>
          <input
            id="adminEmail"
            type="email"
            class="hs-input"
            placeholder="admin@hillystore.com"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <!-- Password -->
      <div class="hs-field">
        <label for="adminPassword" class="hs-label">Contraseña</label>
        <div class="hs-input-wrap">
          <i class="pi pi-lock" aria-hidden="true"></i>
          <input
            id="adminPassword"
            [type]="showPassword() ? 'text' : 'password'"
            class="hs-input"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="hs-toggle-pass-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
          >
            <i [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- Submit button -->
      <button
        type="submit"
        class="hs-login-submit"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
          <span>Iniciando sesión...</span>
        } @else {
          <i class="pi pi-sign-in" aria-hidden="true"></i>
          <span>Entrar al Panel</span>
        }
      </button>
    </form>

    <div class="hs-login-footer">
      <a routerLink="/" class="hs-back-link">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        <span>Volver a la tienda pública</span>
      </a>
    </div>
  </div>
</div>

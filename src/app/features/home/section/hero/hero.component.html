<section class="hs-hero">
  <div class="hs-container hs-hero__grid">
    <!-- Columna Izquierda: Textos y Acciones -->
    <div class="hs-hero__content" pAnimateOnScroll enterClass="hs-enter-fade-up" [once]="true">
      <span class="hs-hero__eyebrow">BANÍ · REP. DOM.</span>

      <h1 class="hs-hero__title">Tu estilo, en stock o desde Shein</h1>

      <p class="hs-hero__desc">
        Ropa para mujeres y hombres, accesorios y colonias. Pide por WhatsApp, rápido y sin
        complicaciones.
      </p>

      <div class="hs-hero__actions">
        <button type="button" class="hs-btn-whatsapp" (click)="onOrderWhatsApp()">
          Pedir por WhatsApp
        </button>

        <a routerLink="/catalogo" class="hs-btn-stock"> Ver el stock </a>
      </div>

      <p class="hs-hero__note">
        Reserva con el {{ settings().depositPercentage }}% · Llega en
        {{ settingsService.sheinDaysRange() }}
      </p>
    </div>

    <!-- Columna Derecha: Tarjeta de Foto Principal -->
    <div class="hs-hero__media" pAnimateOnScroll enterClass="hs-enter-scale" [once]="true">
      <div class="hs-hero__media-card">
        <img
          ngSrc="/hero.png"
          fill 
          priority
          class="object-cover hs-hero__media-placeholder"
          alt="HillyStore Hero Banner"
        />
      </div>
    </div>
  </div>
</section>
